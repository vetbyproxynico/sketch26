name: Live probe

# Calls the real Qloo API, which the cloud build workspace cannot reach, using
# the QLOO_API_KEY repository secret. It makes every kind of call Encore makes
# and reports whether the response fields the adapter reads exist.
# The log is public once the repository is, and Qloo response data must not be
# published, so the output is limited to field names, JSON types, counts,
# statuses and timings. See docs/LIVE_PROBE.md.
#
# Runs by hand from the Actions tab, or when anything is pushed to the branch
# run-probe (the build workspace can push a branch but cannot always press the
# button). The same structure-only output is saved to the branch probe-reports,
# because the build workspace cannot read workflow logs. Delete that branch
# before the repository is made public.
on:
  workflow_dispatch:
  push:
    branches: [run-probe]

permissions:
  contents: write

concurrency:
  group: live-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Qloo live probe
        id: probe
        env:
          QLOO_API_KEY: ${{ secrets.QLOO_API_KEY }}
        run: |
          set +e
          node scripts/live-probe.mjs 2>&1 | tee probe-report.txt
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Save the report to the probe-reports branch
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_CODE: ${{ steps.probe.outputs.code }}
        run: |
          mkdir report && cd report
          grep -vE '^::(group|endgroup)::' ../probe-report.txt > probe-report.txt || true
          {
            echo "run: $GITHUB_RUN_ID"
            echo "commit: $GITHUB_SHA"
            echo "finished: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "exit code: $PROBE_CODE"
            echo "lines: $(wc -l < probe-report.txt)"
          } > probe-meta.txt
          git init -q
          git checkout -q -b probe-reports
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-report.txt probe-meta.txt
          git commit -q -m "Probe report for run $GITHUB_RUN_ID (structure and counts only)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" probe-reports
          echo "::notice title=Probe report::exit code $PROBE_CODE, $(wc -l < probe-report.txt) lines, saved to the probe-reports branch"
      - name: Fail the run if a call failed outright
        if: steps.probe.outputs.code != '0'
        run: exit 1
